name: Build & Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Retain full history for the historical M1-M3 acceptance artifacts.
          fetch-depth: 0

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Verify Milestone 8 contract
        shell: powershell
        run: .\tools\verify-milestone-8.ps1

      - name: Build
        shell: cmd
        run: build.bat

      - name: Smoke OpenGL shader compile and link
        shell: powershell
        run: .\tools\verify-milestone-6-runtime.ps1 -Executable .\blackhole.scr

      - name: Verify Milestone 7 runtime configuration
        shell: powershell
        run: .\tools\verify-milestone-7-runtime.ps1 -Executable .\blackhole.scr

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: blackhole-screensaver
          path: blackhole.scr

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: blackhole-screensaver

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: blackhole.scr
          generate_release_notes: true
